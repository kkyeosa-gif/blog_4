name: Generate posts

on:
  # Daily, before the first 8am ET slot (6:41am EDT / 5:41am EST): the
  # content team tops posts/ready/ up to 5 and makes their GPT images.
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Write exactly this many posts (1-10). Empty = top the queue up to 5."
        required: false
        default: ""

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      ALERT_FILE: alert.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Content team writes posts (writer -> editor -> designer)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          COUNT: ${{ inputs.count }}
        run: node scripts/generate-posts.mjs

      - name: GPT images for the new posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
        run: node scripts/generate-images.mjs || echo "::warning::image generation failed; the publish run retries"

      - name: Commit
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts images
          git diff --cached --quiet && exit 0
          git commit -m "Queue new posts"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.event.repository.default_branch }}" && git push && break
            sleep $((i * 5))
          done

      - name: Alert on problems
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/open-alert.mjs
